name: Debian ARM64 image

on:
  workflow_dispatch:
    inputs:
      ssh_public_key:
        description: 'Your Ed25519 public key (ssh-ed25519 AAAA...); never a private key'
        type: string
        required: true
      admin_user:
        description: Administrative SSH username
        type: string
        required: true
        default: dave

permissions:
  contents: read

concurrency:
  group: debian-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      QMODEM_SSH_PUBLIC_KEY: ${{ inputs.ssh_public_key }}
      QMODEM_ADMIN_USER: ${{ inputs.admin_user }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install tools in the ephemeral native ARM64 builder
        run: |
          test "$(uname -m)" = aarch64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            git curl ca-certificates python3 cpio gzip bzip2 xz-utils zstd \
            openssh-client debootstrap debian-archive-keyring systemd-container \
            file
          echo "JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Validate the public key and build inputs
        run: |
          python3 scripts/ci/test_ci.py
          python3 scripts/ci/prepare-inputs.py

      - name: Fetch pinned public sources
        run: python3 scripts/ci/fetch-sources.py

      - name: Build ARMv8-A kernel and board DTB
        run: bash scripts/build-kernel.sh

      - name: Build static rescue userspace
        run: bash scripts/build-userspace.sh

      - name: Pack LK-compatible RAM rescue image
        env:
          QMODEM_AUTHORIZED_KEYS: ${{ github.workspace }}/build/ci/authorized_keys
        run: |
          mkdir -p images
          bash scripts/pack-rescue.sh

      - name: Bootstrap and configure Debian natively
        run: |
          sudo env \
            QMODEM_ADMIN_USER="$QMODEM_ADMIN_USER" \
            QMODEM_AUTHORIZED_KEYS="$GITHUB_WORKSPACE/build/ci/authorized_keys" \
            SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            bash scripts/ci/build-rootfs.sh

      - name: Assemble and verify the allowlisted artifacts
        run: |
          python3 scripts/ci/package-artifacts.py
          python3 scripts/ci/verify-artifacts.py

      - name: Upload build artifacts only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qmodem-debian13-arm64-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
